name: Android Build

# Builds the installable APK. No Firebase, no google-services.json: the app
# authenticates to the desktop bridge with a shared token, nothing else.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    env:
      # One bucket for every XyrusCode product; the prefix separates them, so a
      # new product needs no new bucket and no new domain.
      R2_BUCKET: software-releases
      R2_PREFIX: opencode/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One signing key for every release, taken from repo secrets rather than a
      # cache. The earlier cache of ~/.android/debug.keystore silently never
      # worked: gradle resolves that directory from ANDROID_SDK_HOME, so the path
      # did not exist, nothing was ever saved, and each release shipped with a
      # different signing identity. Android then treated every build as a
      # separate app, so in-app updates could never install over the previous
      # version. A secret cannot expire or miss quietly, and build.gradle.kts
      # fails the build outright if the key is absent.
      - name: Restore the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set; refusing to build a release that cannot be updated in place"
            exit 1
          fi
          store="$RUNNER_TEMP/opencode-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$store"

          # Prove the key is readable before relying on it, so a truncated or
          # corrupted secret fails here rather than at apksigner.
          keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias opencode >/dev/null

          # printf rather than a heredoc: no indentation surprises inside a YAML
          # block scalar. Written to the repo root because that is where
          # build.gradle.kts looks for it.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=opencode\nkeyPassword=%s\n' \
            "$store" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" \
            > keystore.properties

          # The identity actually signing this build, so a rotation is obvious
          # in the log instead of only on a user's phone.
          cert_sha=$(keytool -list -v -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias opencode | awk -F': ' '/SHA256:/ {print $2}')
          echo "Signing with SHA256 ${cert_sha}"
          echo "SIGNING_CERT_SHA256=${cert_sha}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # A green build that produced no APK is still a failure. Assert on the
      # artifact rather than trusting the task's exit code.
      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no APK at $apk"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          echo "APK verified: $(du -h "$apk" | cut -f1)"

      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Build the heading as a plain string rather than regex-escaping
          # brackets inside awk.
          # Keep-a-Changelog headings carry a date ("## [0.2.3] - 2026-10-16"),
          # so match on the heading as a prefix rather than an exact line. The
          # closing bracket keeps "## [0.2.3]" from matching "## [0.2.30]".
          notes=$(awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See the commit history for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            opencode companion app for Android.

            Install the APK on your phone, then pair it with the opencode running
            on your machine. From 0.5.1 every release is signed with the same
            key, so you can upgrade in place: the app's own update screen
            installs this over the previous version without uninstalling.

            ---
            ## What's new in this version
            ${{ steps.notes.outputs.notes }}

      # Only after the APK has been built, verified and released. A plain push
      # never reaches this step, and a failed build never gets here either.
      #
      # The published layout is what UpdateChecker fetches:
      #   opencode/android/v<version>/opencode-<version>.apk
      #   opencode/android/latest/opencode.apk
      #   opencode/android/latest/version.json
      - name: Mirror the APK and manifest to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          version="${GITHUB_REF_NAME#v}"
          asset="opencode-${version}.apk"

          # The manifest the in-app updater reads. apkFiles maps ABI -> filename
          # under the versioned directory. We ship one universal APK, so every
          # ABI points at the same file. jq keeps multi-line release notes a
          # valid JSON string instead of breaking the document.
          jq -n --arg version "$version" --arg apk "$asset" --arg notes "$RELEASE_NOTES" \
            '{version:$version, apkFiles:{arm64_v8a:$apk, armeabi_v7a:$apk, x86_64:$apk, universal:$apk}, releaseNotes:$notes}' \
            > version.json

          # Two keys on purpose. The versioned one is immutable and is what a
          # changelog can link to. The latest one never changes, so a product
          # page does not have to be edited at every release.
          #
          # --remote is required: without it wrangler writes to its local
          # simulator, prints "Upload complete", and nothing reaches R2.
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$R2_PREFIX/v${version}/$asset" \
            --file "$apk" --content-type application/vnd.android.package-archive --remote

          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$R2_PREFIX/latest/opencode.apk" \
            --file "$apk" --content-type application/vnd.android.package-archive --remote

          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/$R2_PREFIX/latest/version.json" \
            --file version.json --content-type application/json --remote

      - name: Read the APK back out of R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="opencode-${version}.apk"

          # A 200 from an upload is not proof the bytes landed intact. Pull the
          # published object back and compare it to what was built.
          npx --yes wrangler@4 r2 object get \
            "$R2_BUCKET/$R2_PREFIX/v${version}/$asset" \
            --file "roundtrip-$asset" --remote

          if ! cmp -s "app/build/outputs/apk/release/app-release.apk" "roundtrip-$asset"; then
            echo "::error::the object in R2 is not byte identical to the built APK"
            exit 1
          fi

          # The round-tripped file must still be a valid, signed APK.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "roundtrip-$asset"
          echo "R2 object matches the built APK and still verifies."