name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version"
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" v "\\]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See the commit history for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            opencode Companion — Android video & playlist downloader (YouTube, X & TikTok).

            Install the APK matching your device ABI (arm64-v8a for most phones), or the
            universal APK. yt-dlp and ffmpeg are bundled inside the app; no extra setup is
            required.

            Signed with the project's stable key, so updates install straight over a previous
            install. **One-time note:** if you have an older build signed with a different key,
            uninstall it once before installing this one.

            ## What's new in this version
            ${{ steps.notes.outputs.notes }}