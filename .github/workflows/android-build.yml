name: Android Build

# Builds the installable APK. No Firebase, no google-services.json: the app
# authenticates to the desktop bridge with a shared token, nothing else.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # A green build that produced no APK is still a failure. Assert on the
      # artifact rather than trusting the task's exit code.
      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no APK at $apk"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          echo "APK verified: $(du -h "$apk" | cut -f1)"

      - name: Extract release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version"
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" v "\\]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See the commit history for details."
          fi
          {
            echo 'notes<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            opencode companion app for Android.

            Install the APK on your phone, then start the bridge on your desktop
            with `python -m bridge` and enter the desktop's IP on the pairing
            screen.

            **Note:** this APK is signed with the debug key so it is installable
            for testing. Uninstall any previous build before upgrading once a
            release key is in place.
