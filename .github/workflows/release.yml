name: Release to R2

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  mirror:
    name: Mirror APKs to Cloudflare R2
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      # The payloads live in git's object store, not the working tree, so the publish script
      # needs full history to restore them. fetch-depth: 0 is required, not incidental.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish engine payloads to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$TAG"
          version="${version#v}"
          # Restore the payloads first, then verify them: a payload that lost its symlinks
          # unpacks cleanly and fails at dlopen long after the release that broke it.
          # --rerun-tasks is required because Gradle restores this task FROM-CACHE on a warm
          # runner, which would silently skip the payload assertions on every re-run.
          pwsh ./scripts/build-engine-manifest.ps1 -Version "$version" -RestoreOnly -KeepPayloads
          ./gradlew :youtubedl-android:testDebugUnitTest --rerun-tasks --stacktrace
          pwsh ./scripts/build-engine-manifest.ps1 -Version "$version" -KeepPayloads

      - name: Mirror to Cloudflare R2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          mkdir -p dist
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.apk" \
            --dir dist
          echo "Downloaded APKs:"
          ls -la dist/
          
          # Build version.json manifest for the update checker
          cat > dist/version.json << EOF
          {
            "version": "$version",
            "releaseNotes": "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body | head -20 | sed 's/"/\\"/g' | tr '\n' ' ')",
            "apkFiles": {
              "arm64-v8a": "$(ls dist/ | grep arm64 | head -1)",
              "armeabi-v7a": "$(ls dist/ | grep armeabi | head -1)",
              "x86_64": "$(ls dist/ | grep x86_64 | head -1)",
              "universal": "$(ls dist/ | grep universal | head -1)"
            }
          }
          EOF
          cat dist/version.json
          
          npm install -g wrangler
          for f in dist/*.apk dist/version.json; do
            wrangler r2 object put "video-plucker-releases/mobile/$tag/$(basename "$f")" --file "$f" --remote
          done

          # Also copy version.json to /mobile/latest/ for the update checker
          wrangler r2 object put "video-plucker-releases/mobile/latest/version.json" --file "dist/version.json" --remote
          
          echo "Mirrored to R2: mobile/$tag/"